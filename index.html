<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="utf-8" />
    <title>TEAM DEMUKI AR名刺</title>
    <!-- A-Frame 最新安定版 -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR (A-Frame版) -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <script>
      // タップしてURLを開くコンポーネント
      AFRAME.registerComponent('link-handler', {
        init: function () {
          this.el.addEventListener('click', function () {
            const targetUrl = this.getAttribute('data-url');
            if (targetUrl) {
              window.open(targetUrl, '_blank');
            }
          });
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- mindar-image でアップロードした targets.mind を指定 -->
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 透過PNG画像アセット -->
        <img id="car-img" src="./demuki.png">
        <img id="bubble-img" src="./logo.png">
        <img id="youtube-img" src="./youtube.png">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable"></a-camera>

      <!-- targetIndex: 0 はTEAM DEMUKIロゴ・名刺面に対応 -->
      <a-entity mindar-image-target="targetIndex: 0">
        
        <!-- 1. 床面（影）：名刺の上に水平に配置 -->
        <a-circle 
          position="0 0 0.01" 
          rotation="-90 0 0" 
          radius="0.7" 
          color="#000000" 
          material="opacity: 0.25; transparent: true">
        </a-circle>

        <!-- 2. 車両 (demuki.png)：中央接地・見下ろし用にわずかに上向き傾斜 -->
        <a-image 
          id="car-model"
          src="#car-img" 
          position="0 0.35 0.05" 
          rotation="-10 0 0" 
          width="1.2" 
          height="0.74">
        </a-image>

        <!-- 3. フキダシ (logo.png)：左上配置（しっぽが右下の車を指す導線） -->
        <a-image 
          id="website-btn"
          src="#bubble-img" 
          position="-0.45 0.75 0.1" 
          rotation="0 0 0" 
          width="0.65" 
          height="0.36"
          data-url="https://demuki.jp/"
          link-handler
          class="clickable"
          animation="property: position; to: -0.45 0.78 0.1; dur: 1200; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-image>

        <!-- 4. YouTube (youtube.png)：右上配置（フキダシと高さを揃えて並列配置） -->
        <a-image 
          id="youtube-btn"
          src="#youtube-img" 
          position="0.45 0.75 0.1" 
          rotation="0 0 0" 
          width="0.5" 
          height="0.15"
          data-url="https://www.youtube.com/watch?v=xkJmBgriu2w"
          link-handler
          class="clickable"
          animation="property: position; to: 0.45 0.78 0.1; dur: 1200; easing: easeInOutQuad; loop: true; dir: alternate">
        </a-image>

      </a-entity>
    </a-scene>
  </body>
</html>
